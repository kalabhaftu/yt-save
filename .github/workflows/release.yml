name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          target: x86_64-pc-windows-msvc

      - name: Verify source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $branding = Get-Content -Raw branding.json | ConvertFrom-Json
          $releaseTag = $env:RELEASE_TAG
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag must use the vMAJOR.MINOR.PATCH format: $releaseTag" }
          $tagVersion = $releaseTag -replace '^v', ''
          $cargoText = Get-Content -Raw Cargo.toml
          $cargoMatch = [regex]::Match($cargoText, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) { throw "Could not read the workspace version from Cargo.toml." }
          if ($branding.version -ne $tagVersion -or $cargoMatch.Groups[1].Value -ne $tagVersion) {
            throw "Release tag $releaseTag, branding version $($branding.version), and Cargo version $($cargoMatch.Groups[1].Value) must match."
          }
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python -m unittest discover -s tests -v

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --tool-path ./target/tooling wix --version 5.0.2
          (Resolve-Path ./target/tooling).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Inno Setup
        shell: pwsh
        run: |
          $paths = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          if (-not $paths) { throw "The hosted Windows runner does not contain Inno Setup 6." }
          Write-Host "Found Inno Setup compiler at $($paths[0]); the packaging step will compile the installer."

      - name: Build verified dependencies and Windows installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build_windows_package.ps1 -Configuration release

      - name: Smoke-test MSI and Inno installers
        shell: pwsh
        run: ./scripts/test_windows_installers.ps1

      - name: Publish installers and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $branding = Get-Content -Raw branding.json | ConvertFrom-Json
          $releaseDirectory = Join-Path ./dist $branding.version
          $assets = @(
            (Join-Path $releaseDirectory "$($branding.package_name)-$($branding.version)-x64.msi"),
            (Join-Path $releaseDirectory "$($branding.package_name)-$($branding.version)-x64-setup.exe"),
            (Join-Path $releaseDirectory "SHA256SUMS.txt")
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Expected release asset is missing: $asset" }
          }
          gh release create $env:RELEASE_TAG @assets --generate-notes --title $env:RELEASE_TAG --prerelease
