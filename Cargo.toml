[workspace]
members = ["crates/yt-save"]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
authors = ["Yt Save contributors"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.18.1"
thiserror = "2.0"
tokio = { version = "1.50", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.16", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
